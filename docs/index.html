<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Inbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b5a">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Liquid-glass look: aurora gradient behind frosted panels, squircle icon tiles,
     floating pill tab bar, bottom-sheet notes. Everything is tokens below. */
  :root {
    --ink:#14161c; --ink-2:rgba(20,22,28,.62); --ink-3:rgba(20,22,28,.4);
    --canvas:#eef0f6;
    --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.75); --hairline:rgba(20,22,28,.08);
    --shadow:0 10px 30px -12px rgba(30,40,80,.28), 0 2px 6px rgba(30,40,80,.06);
    --cta-bg:#14161c; --cta-fg:#fff; --accent:#0a7a66;
    --helpful:#30c46a; --helpful-2:#12a05a; --mixed:#ffae2b; --mixed-2:#f08400;
    --misleading:#ff6259; --misleading-2:#e0342f; --noise:#a3a8b3; --noise-2:#7d828f;
    --aurora-a:rgba(88,224,190,.55); --aurora-b:rgba(255,196,120,.5); --aurora-c:rgba(255,140,170,.4); --aurora-d:rgba(120,160,255,.38);
    --font:"Plus Jakarta Sans", ui-rounded, -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --ink:#f4f6fb; --ink-2:rgba(244,246,251,.66); --ink-3:rgba(244,246,251,.42);
    --canvas:#0a0c12;
    --glass:rgba(34,38,52,.55); --glass-strong:rgba(30,34,48,.82); --glass-line:rgba(255,255,255,.12); --hairline:rgba(255,255,255,.09);
    --shadow:0 12px 34px -12px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
    --cta-bg:#f4f6fb; --cta-fg:#12141a; --accent:#5fe0c3;
    --aurora-a:rgba(30,170,140,.42); --aurora-b:rgba(190,110,30,.3); --aurora-c:rgba(190,50,100,.28); --aurora-d:rgba(60,90,220,.34);
    color-scheme: dark; } }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
         padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(42% 36% at 12% 8%, var(--aurora-a), transparent 70%),
      radial-gradient(38% 34% at 92% 18%, var(--aurora-d), transparent 70%),
      radial-gradient(46% 38% at 80% 92%, var(--aurora-c), transparent 70%),
      radial-gradient(40% 34% at 8% 86%, var(--aurora-b), transparent 70%); }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  p { margin: 0; } a { color: var(--accent); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

  .glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 24px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);
           -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-strong); } }

  /* header */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; min-height: 44px; }
  h1 { font-size: 40px; line-height: 1.02; margin: 0; font-weight: 800; letter-spacing: -.04em; }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); cursor: pointer; border: 1px solid var(--glass-line); font: inherit; padding: 0; }
  .round svg { width: 20px; height: 20px; }
  .msg { font-size: 14px; color: var(--ink-2); padding: 0 6px; } .msg.err { color: var(--misleading-2); }

  input[type=search], input[type=url], input[type=password] { width: 100%; padding: 15px 18px; font: 500 16px var(--font); color: var(--ink); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px;
    -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); box-shadow: var(--shadow); }
  input::placeholder { color: var(--ink-3); }
  .cta { font: 700 15px var(--font); padding: 15px 22px; border-radius: 999px; border: 0; background: var(--cta-bg); color: var(--cta-fg); cursor: pointer; transition: transform .2s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; }
  .cta:active { transform: scale(.94); } .cta:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; } .grow { flex: 1; min-width: 0; }

  /* hero ring */
  .hero { padding: 18px; display: flex; align-items: center; gap: 20px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .9s cubic-bezier(.2,.9,.2,1), opacity .25s; cursor: pointer; }
  .ring .track { stroke: var(--hairline); cursor: default; }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num b { font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .ring .num span { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
  .legend { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lg { border: 0; background: transparent; font: inherit; text-align: left; padding: 8px 10px; border-radius: 14px; cursor: pointer; color: var(--ink); display: grid; gap: 1px; transition: background .2s, opacity .2s; }
  .lg b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; display: flex; align-items: center; gap: 7px; }
  .lg b i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .lg span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .lg[aria-pressed="true"] { background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-line); }
  .lg.dim { opacity: .45; } .lg.zero { opacity: .4; }

  .u-helpful { --c: var(--helpful); --c2: var(--helpful-2); } .u-mixed { --c: var(--mixed); --c2: var(--mixed-2); }
  .u-misleading { --c: var(--misleading); --c2: var(--misleading-2); } .u-noise { --c: var(--noise); --c2: var(--noise-2); }

  /* list cards with squircle tiles */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; gap: 14px; align-items: flex-start; padding: 16px; cursor: pointer; transition: transform .25s cubic-bezier(.3,1.5,.5,1);
          animation: rise .6s cubic-bezier(.2,.9,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  .still .card { animation: none; }
  .card:active { transform: scale(.975); }
  .tile { width: 48px; height: 48px; border-radius: 15px; flex: none; display: grid; place-items: center; color: #fff;
          background: linear-gradient(150deg, var(--c), var(--c2)); box-shadow: 0 6px 14px -6px var(--c2), inset 0 1px 0 rgba(255,255,255,.4); }
  .tile svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; animation: turn 0.9s linear infinite; }
  .card .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }
  .card .sub { font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .card .key { font-size: 15px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { text-align: center; color: var(--ink-2); padding: 44px 0; font-weight: 600; }

  .track { display: flex; gap: 5px; margin-top: 8px; }
  .track span { flex: 1; height: 6px; border-radius: 3px; background: var(--hairline); position: relative; overflow: hidden; }
  .track span.on { background: var(--accent); }
  .track.warn span.on { background: var(--misleading); }
  .track span.live::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: sweep 1.4s ease-in-out infinite; }

  /* floating tab bar */
  nav { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 20; pointer-events: none; }
  nav .inner { pointer-events: auto; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass-strong); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 22px 8px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 11px; font-weight: 700; position: relative; transition: background .3s, color .3s; }
  nav a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  nav a[aria-current="page"] { color: var(--ink); background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-line), 0 4px 12px -6px rgba(0,0,0,.3); }
  nav .n { position: absolute; top: 3px; right: 12px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--misleading); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

  /* iOS-style segmented control */
  .seg { display: flex; padding: 4px; border-radius: 999px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; font: 700 14px var(--font); padding: 10px 6px; border-radius: 999px; color: var(--ink-2); cursor: pointer; transition: background .25s, color .25s; }
  .seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 2px 8px -3px rgba(0,0,0,.3), inset 0 0 0 1px var(--glass-line); }

  /* claims */
  details.claim { padding: 4px 18px; animation: rise .6s cubic-bezier(.2,.9,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  .still details.claim { animation: none; }
  details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 13px 0; font-weight: 700; letter-spacing: -.01em; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { margin-left: auto; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.4; stroke-linecap: round; transition: transform .3s cubic-bezier(.3,1.4,.5,1); flex: none; }
  details[open] > summary .chev { transform: rotate(90deg); }
  details > summary .tile { width: 36px; height: 36px; border-radius: 11px; } details > summary .tile svg { width: 19px; height: 19px; }
  details .inner { padding: 0 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .pillbtn { display: inline-flex; align-self: flex-start; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #fff; background: linear-gradient(150deg, var(--c), var(--c2)); }
  .lead { font-size: 16px; color: var(--ink-2); line-height: 1.5; }

  /* note sheet */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,20,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 7vh; z-index: 41; margin: 0 auto; max-width: 680px; border-radius: 32px 32px 0 0; overflow: auto; overscroll-behavior: contain;
           background: var(--glass-strong); border: 1px solid var(--glass-line); border-bottom: 0; -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
           transform: translateY(104%); transition: transform .5s cubic-bezier(.2,.9,.2,1); padding: 10px 20px calc(40px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.45); }
  .scrim.open { opacity: 1; } .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: .5; margin: 0 auto 14px; }
  .sheet .close { position: sticky; top: 0; float: right; width: 36px; height: 36px; margin: 0 0 -36px; font-size: 0; z-index: 2; background: var(--glass); }
  .sheet .close svg { width: 16px; height: 16px; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; fill: none; }
  .sheet .head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .sheet .tile { width: 64px; height: 64px; border-radius: 20px; } .sheet .tile svg { width: 32px; height: 32px; }
  .sheet h2 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -.035em; }
  .sheet .big { font-size: 18px; line-height: 1.45; color: var(--ink-2); font-weight: 500; }
  .btn-link { display: inline-block; align-self: flex-start; padding: 13px 20px; border-radius: 999px; background: var(--cta-bg); color: var(--cta-fg); font-weight: 700; text-decoration: none; font-size: 15px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .shelf { display: flex; gap: 6px; overflow-x: auto; margin: 0 -18px; padding: 4px 18px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .shelf::-webkit-scrollbar, .chips.scroll::-webkit-scrollbar { display: none; }
  .cat { flex: none; width: 82px; border: 0; background: transparent; font: inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; cursor: pointer; scroll-snap-align: start; transition: transform .25s cubic-bezier(.3,1.5,.5,1), opacity .2s; }
  .cat:active { transform: scale(.92); }
  .cat .tile { width: 60px; height: 60px; border-radius: 19px; transition: box-shadow .25s; } .cat .tile svg { width: 28px; height: 28px; }
  .cat .l { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.15; }
  .cat .n { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-top: -3px; }
  .cat[aria-pressed="true"] .tile { box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5.5px var(--c2); }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 0 18px 2px; scrollbar-width: none; }
  .chips.scroll .chip { flex: none; }
  .chip[aria-pressed="true"] { background: var(--cta-bg); color: var(--cta-fg); border-color: transparent; }
  .chip { font: 700 13px var(--font); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); cursor: pointer; }
  .group { border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-line); padding: 2px 18px; margin-bottom: 12px; }
  .group > summary { padding: 15px 0; }
  .group .inner { padding-bottom: 16px; }

  .md { overflow-wrap: anywhere; font-size: 15px; color: var(--ink); }
  .md h1 { font-size: 19px; margin: 4px 0 8px; } .md h2 { font-size: 16px; margin: 18px 0 6px; } .md h3 { font-size: 15px; margin: 12px 0 4px; }
  .md p, .md ul, .md blockquote, .md pre { margin: 0 0 10px; } .md ul { padding-left: 20px; }
  .md blockquote { border-left: 3px solid var(--hairline); padding-left: 12px; color: var(--ink-2); }
  .md code { font: 13px ui-monospace, Menlo, monospace; background: var(--hairline); padding: 1px 6px; border-radius: 6px; }
  .md pre { background: var(--hairline); padding: 12px; border-radius: 12px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
  .md .scroll { overflow-x: auto; margin-bottom: 10px; }
  .md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .md th, .md td { border-bottom: 1px solid var(--hairline); padding: 9px 8px; text-align: left; vertical-align: top; }
  .md th { color: var(--ink-3); font-weight: 700; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">Library</h1>
    <button class="round glass" id="gear" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <section id="settings" class="glass" style="padding:18px; display:flex; flex-direction:column; gap:12px" hidden>
    <p class="msg" style="padding:0">Paste a GitHub token for <code id="repoName"></code> (Issues: read and write, Contents: read-only). It stays on this phone.</p>
    <form id="tokenForm" class="row" autocomplete="off">
      <div class="grow"><input id="token" type="password" placeholder="github_pat_…" aria-label="GitHub token"></div>
      <button class="cta" type="submit">Save</button>
    </form>
    <button class="chip" id="clearToken" type="button" hidden style="align-self:flex-start">Remove token</button>
  </section>

  <div id="view"></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Note" hidden></div>

<nav><div class="inner glass">
  <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Library</a>
  <a href="#/queue" data-tab="queue"><svg viewBox="0 0 24 24"><path d="M4 13l2.4-7a2 2 0 0 1 1.9-1.4h7.4a2 2 0 0 1 1.9 1.4L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/></svg>Queue<span class="n" id="qn" hidden></span></a>
  <a href="#/claims" data-tab="claims"><svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3.1 8.1-7.5 9.5-4.4-1.4-7.5-5-7.5-9.5V6z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6"/></svg>Claims</a>
</div></nav>

<script>
(function () {
  "use strict";
  var OWNER = "ARVR7", REPO = "insta-yt-scraper", LABEL = "link";
  var ORDER = ["helpful", "mixed", "misleading", "noise"];
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view"), sheet = $("sheet"), scrim = $("scrim");
  var state = { library: null, filter: { q: "", usefulness: "", category: "", sub: "", loc: "" }, tax: null, flash: null, timer: null, refresh: false, tab: null };
  var SVGNS = "http://www.w3.org/2000/svg";

  /* ---------- storage and API ---------- */
  function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
  function setToken(v) { try { v ? localStorage.setItem("gh_token", v) : localStorage.removeItem("gh_token"); } catch (e) {} }
  function cacheGet(k) { try { return JSON.parse(localStorage.getItem("c:" + k)); } catch (e) { return null; } }
  function cacheSet(k, v) { try { localStorage.setItem("c:" + k, JSON.stringify(v)); } catch (e) {} }
  function api(path, opts, raw) {
    opts = opts || {};
    opts.headers = Object.assign({ "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      "Authorization": "Bearer " + getToken(), "X-GitHub-Api-Version": "2022-11-28" }, opts.headers || {});
    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + path, opts).then(function (r) {
      if (r.ok) return raw ? r.text() : r.json();
      return r.json().catch(function () { return {}; }).then(function (j) { var e = new Error(j.message || ("HTTP " + r.status)); e.status = r.status; throw e; });
    });
  }
  function file(path) {
    return api("/contents/" + path + "?ref=main", null, true).then(function (t) { cacheSet(path, t); return t; })
      .catch(function (e) { var c = cacheGet(path); if (c != null) return c; throw e; });

    box.appendChild(el("p", "empty", "Loading…"));
    Promise.all([file("notes/" + platform + "/" + id + ".md"), (state.library ? Promise.resolve(state.library) : loadLibrary()).catch(function () { return []; })]).then(function (r) {
      box.textContent = "";
      var t = r[0], it = r[1].filter(function (z) { return z.platform === platform && z.id === id; })[0] || {};
      var body = t.replace(/^---\n[\s\S]*?\n---\n/, "");
      var head = el("div", "head u-" + (it.usefulness || "noise"));
      head.appendChild(tile(it.usefulness, it.usefulness));
      head.appendChild(el("h2", "", it.title || id));
      head.appendChild(el("div", "msg", plat(platform) + (it.usefulness ? " · " + it.usefulness : "")));
      if (it.key_info) head.appendChild(el("p", "big", it.key_info));
      var url = (t.match(/^url:\s*(\S+)/m) || [])[1];
      if (url && /^https?:\/\//.test(url)) { var a = el("a", "btn-link", "Open original"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; head.appendChild(a); }
      var chipsRow = el("div", "chips");
      function jump(f) { state.filter = Object.assign({ q: "", usefulness: "", category: "", sub: "", loc: "" }, f); closeSheet(true); location.hash = "#/library"; setTimeout(route, 0); }
      if (it.category) { var cb = el("button", "chip", catPath(it)); cb.type = "button"; cb.addEventListener("click", function () { jump({ category: it.category, sub: it.subcategory || "" }); }); chipsRow.appendChild(cb); }
      if (it.location) { var lb = el("button", "chip", it.location_label); lb.type = "button"; lb.addEventListener("click", function () { jump({ loc: it.location }); }); chipsRow.appendChild(lb); }
      (it.also || []).forEach(function (a) { var ck = a.split("/")[0], c = ((state.tax && state.tax.categories) || []).filter(function (x) { return x.key === ck; })[0]; var ab = el("button", "chip", "Also: " + (c ? c.label : ck)); ab.type = "button"; ab.addEventListener("click", function () { jump({ category: ck }); }); chipsRow.appendChild(ab); });
      if (chipsRow.firstChild) head.appendChild(chipsRow);
      box.appendChild(head);
      var parts = body.split(/^## /m).slice(1), by = {};
      parts.forEach(function (p) { var nl = p.indexOf("\n"); by[p.slice(0, nl).trim()] = p.slice(nl + 1); });
      var rk = Object.keys(by).filter(function (k) { return /^Research/.test(k); })[0];
      if (by["Summary"]) box.appendChild(group("Summary", by["Summary"], true));
      if (rk) box.appendChild(group("What checks out", by[rk], true));
      box.appendChild(group("Full note", body, false));
    }).catch(function (e) { box.textContent = ""; box.appendChild(failure(e, "this note")); });
  }

  /* ---------- Queue ---------- */
  function trackFor(issue) {
    var names = issue.labels.map(function (l) { return l.name; });
    var warn = names.indexOf("needs-input") >= 0 && issue.state !== "closed";
    var step = issue.state === "closed" ? 3 : (names.indexOf("processing") >= 0 || warn) ? 2 : 1;
    var tr = el("div", "track" + (warn ? " warn" : ""));
    for (var k = 1; k <= 3; k++) tr.appendChild(el("span", (k <= step ? "on" : "") + (k === step && step === 2 && !warn ? " live" : "")));
    return { node: tr, step: step, warn: warn, word: warn ? "Needs your input" : ["", "Waiting", "Working", "Done"][step] };
  }
  function viewQueue() {
    var refresh = state.refresh; state.refresh = false;
    $("title").textContent = "Queue"; clearInterval(state.timer); view.textContent = "";
    var box = el("div", "list" + (refresh ? " still" : "")); view.appendChild(box);
    var flash = state.flash; state.flash = null;
    var form = el("form", "row"); form.autocomplete = "off";
    var w = el("div", "grow"), inp = el("input"); inp.type = "url"; inp.placeholder = "Paste a link"; inp.setAttribute("aria-label", "Link to add"); w.appendChild(inp);
    var btn = el("button", "cta", "Add"); btn.type = "submit";
    form.appendChild(w); form.appendChild(btn); box.appendChild(form);
    var note = msg(flash ? flash.msg : "", flash && !flash.ok); if (!flash) note.hidden = true; box.appendChild(note);
    var list = el("div", "list"); box.appendChild(list);
    if (!getToken()) { view.textContent = ""; view.appendChild(needsToken()); return; }
    form.addEventListener("submit", function (e) {
      e.preventDefault(); var p = findLink(inp.value);
      if (!p) { note.hidden = false; note.className = "msg err"; note.textContent = "Not an Instagram or YouTube link."; return; }
      btn.disabled = true; queueLink(p).then(function (r) { state.flash = r; viewQueue(); });
    });
    state.timer = setInterval(function () {
      if (document.visibilityState === "visible" && !inp.value && document.activeElement !== inp) { state.refresh = true; viewQueue(); }
    }, 60000);
    loadIssues().then(function (issues) {
      return Promise.resolve(state.library || loadLibrary().catch(function () { return []; })).then(function (lib) {
        if (!issues.length) { list.appendChild(el("p", "empty", "Queue is empty.")); return; }
        issues.forEach(function (iss) {
          var m = iss.title.match(/^Link: (\w+) ([\w-]+)$/);
          var done = m && (lib || []).filter(function (x) { return x.platform === m[1] && x.id === m[2]; })[0];
          var tk = trackFor(iss);
          var c = el("article", "card glass u-" + (done ? done.usefulness : tk.warn ? "misleading" : "noise")); c.tabIndex = 0;
          c.appendChild(done ? tile(done.usefulness, done.usefulness) : tk.warn ? tile("alert", "misleading") : tk.step === 2 ? tile("", "noise", true) : tile("wait", "noise"));
          var b = el("div", "body");
          b.appendChild(el("h3", "", done ? done.title : (m ? plat(m[1]) + " · " + m[2] : iss.title)));
          b.appendChild(el("div", "sub", (done ? done.usefulness + " · " : "") + tk.word)); b.appendChild(tk.node); c.appendChild(b);
          var go = function () { if (done) openNote(done); else window.open(iss.html_url, "_blank", "noopener"); };
          c.addEventListener("click", go); c.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
          list.appendChild(c);
        });
        stagger(list);
      });
    }).catch(function (e) { list.appendChild(failure(e, "the queue")); });
  }

  /* ---------- Claims ---------- */
  var CLAIMS = [["verified", "Verified", "registry/verified.md"], ["hoax", "Hoax", "registry/hoax.md"], ["sidequests", "Side quests", "registry/sidequests.md"]];
  function verdictKind(v) { return /^verified-with/.test(v) ? ["mixed", "mixed"] : /^verified/.test(v) ? ["helpful", "helpful"] : /misleading|hoax/.test(v) ? ["misleading", "misleading"] : ["noise", "noise"]; }
  function viewClaims(which) {
    $("title").textContent = "Claims"; view.textContent = "";
    var seg = el("div", "seg glass");
    CLAIMS.forEach(function (c) { var b = el("button", "", c[1]); b.type = "button"; b.setAttribute("aria-pressed", c[0] === which ? "true" : "false"); b.addEventListener("click", function () { location.hash = "#/claims/" + c[0]; }); seg.appendChild(b); });
    view.appendChild(seg);
    if (!getToken()) { view.appendChild(needsToken()); return; }
    var box = el("div", "list"); box.style.marginTop = "14px"; view.appendChild(box);
    var path = (CLAIMS.filter(function (c) { return c[0] === which; })[0] || CLAIMS[0])[2];
    file(path).then(function (t) {
      var items = [], cur = null, grp = "";
      t.split("\n").forEach(function (l) {
        var m;
        if ((m = l.match(/^## (.*)/))) { grp = m[1]; cur = null; }
        else if ((m = l.match(/^### (.*)/))) { cur = { name: m[1].replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/, "").trim(), grp: grp, lines: [] }; items.push(cur); }
        else if (cur) cur.lines.push(l);
      });
      if (!items.length) { box.appendChild(el("p", "empty", "Nothing here yet.")); return; }
      items.forEach(function (it) {
        var body = it.lines.join("\n");
        var v = (body.match(/\*\*Verdict:\*\*\s*([\w-]+)/) || [])[1] || "", what = (body.match(/\*\*What it is:\*\*\s*(.*)/) || [])[1] || "";
        var k = verdictKind(v), d = el("details", "claim glass u-" + k[1]);
        var s = el("summary"); s.appendChild(tile(k[0], k[1])); s.appendChild(el("span", "", it.name)); s.appendChild(CHEV()); d.appendChild(s);
        var b = el("div", "inner"); b.appendChild(el("span", "pillbtn", v.replace(/-/g, " ") + (/Pending/.test(it.grp) ? " · pending" : "")));
        if (what) { var wp = el("p", "lead"); inline(wp, what); b.appendChild(wp); }
        var rest = el("details", "group"); var rs = el("summary"); rs.appendChild(el("span", "", "Details")); rs.appendChild(CHEV()); rest.appendChild(rs);
        var rb = el("div", "inner"); rb.appendChild(renderMd(body)); rest.appendChild(rb); b.appendChild(rest);
        d.appendChild(b); box.appendChild(d);
      });
      stagger(box);
    }).catch(function (e) { box.appendChild(failure(e, "the claims")); });
  }

  /* ---------- router ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var tab = parts[0] || "library", shown = tab === "note" ? "library" : tab;
    Array.prototype.forEach.call(document.querySelectorAll("nav a"), function (a) { a.setAttribute("aria-current", a.dataset.tab === shown ? "page" : "false"); });
    clearInterval(state.timer);
    if (tab !== "note") closeSheet(true);
    if (tab === "note" && parts[1] && parts[2]) {
      if (state.tab !== "library") { state.tab = "library"; viewLibrary(); }
      viewNote(parts[1].replace(/[^\w]/g, ""), parts[2].replace(/[^\w-]/g, "")); return;
    }
    window.scrollTo(0, 0); state.tab = shown;
    if (tab === "queue") viewQueue();
    else if (tab === "claims") viewClaims(parts[1] || "verified");
    else viewLibrary();
  }

  /* ---------- settings ---------- */
  $("repoName").textContent = OWNER + "/" + REPO;
  function refreshSettings() { var has = !!getToken(); $("clearToken").hidden = !has; $("token").placeholder = has ? "Saved. Paste to replace." : "github_pat_…"; }
  $("gear").addEventListener("click", function () { $("settings").hidden = !$("settings").hidden; });
  $("tokenForm").addEventListener("submit", function (e) { e.preventDefault(); var v = $("token").value.trim(); if (!v) return; setToken(v); $("token").value = ""; $("settings").hidden = true; refreshSettings(); state.library = null; state.tab = null; route(); });
  $("clearToken").addEventListener("click", function () { setToken(""); refreshSettings(); state.library = null; state.tab = null; route(); });
  refreshSettings();
  if (!getToken()) $("settings").hidden = false;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  window.addEventListener("hashchange", route);

  /* ---------- share target: ?title=&text=&url= ---------- */
  var qs = new URLSearchParams(location.search);
  var shared = [qs.get("url"), qs.get("text"), qs.get("title")].filter(Boolean).join(" ");
  if (shared) {
    var p = findLink(shared);
    history.replaceState(null, "", location.pathname + "#/queue");
    if (!p) { state.flash = { msg: "No Instagram or YouTube link found.", ok: false }; route(); }
    else if (!getToken()) { state.flash = { msg: "Add your token in settings, then share again.", ok: false }; route(); }
    else { $("title").textContent = "Queue"; view.textContent = ""; view.appendChild(el("p", "empty", "Adding…")); queueLink(p).then(function (r) { state.flash = r; route(); }); }
  } else route();
})();
</script>
</body>
