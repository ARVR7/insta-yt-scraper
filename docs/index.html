<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Inbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b5a">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg:#f4f6f5; --surface:#fff; --fg:#17211d; --muted:#6b7a73; --line:#e3e9e6;
    --accent:#0e6b5a; --accent-fg:#fff;
    --helpful:#1f8a52; --mixed:#c98a10; --misleading:#c2393a; --noise:#8a9690;
    --helpful-bg:#dcf1e5; --mixed-bg:#fff1cf; --misleading-bg:#fbe0e0; --noise-bg:#e9eeeb;
    --err:#a32525;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1613; --surface:#17211d; --fg:#e6eee9; --muted:#8fa097; --line:#26332d;
    --accent:#3fb59d; --accent-fg:#07130f;
    --helpful:#4cc283; --mixed:#e3a935; --misleading:#e46a6a; --noise:#8fa097;
    --helpful-bg:#12362a; --mixed-bg:#3a2f10; --misleading-bg:#411a1a; --noise-bg:#222d28;
    --err:#f0a0a0; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
  p { margin: 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .icon { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 6px; line-height: 1; cursor: pointer; }
  input { width: 100%; padding: 13px 14px; font: 16px system-ui; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  button.main { font: 600 15px system-ui; padding: 13px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .55; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .wrap { flex-wrap: wrap; }
  .msg { font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--err); }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
        display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav .inner { display: flex; width: 100%; max-width: 640px; }
  nav a { flex: 1; text-align: center; padding: 12px 4px 11px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; }
  nav a[aria-current="page"] { color: var(--accent); }
  nav a .n { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; line-height: 18px; }

  .u-helpful { --u: var(--helpful); --ub: var(--helpful-bg); } .u-mixed { --u: var(--mixed); --ub: var(--mixed-bg); }
  .u-misleading { --u: var(--misleading); --ub: var(--misleading-bg); } .u-noise { --u: var(--noise); --ub: var(--noise-bg); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--u, var(--noise)); margin-right: 6px; vertical-align: 1px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: 600 14px system-ui; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
  .card .sub { font-size: 13px; color: var(--muted); }
  .card .key { font-size: 15px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.plain { cursor: default; }

  .track { display: flex; gap: 4px; margin-top: 4px; }
  .track span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .track span.on { background: var(--accent); }
  .track.warn span.on { background: var(--misleading); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .back { align-self: flex-start; }
  .lead { font-size: 18px; line-height: 1.45; }
  .btn-link { display: inline-block; padding: 11px 16px; border-radius: 12px; background: var(--surface); color: var(--accent); font-weight: 600; text-decoration: none; font-size: 15px; }
  details { background: var(--surface); border-radius: 14px; padding: 4px 16px; }
  details > summary { cursor: pointer; font-weight: 600; padding: 12px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; color: var(--muted); font-size: 20px; }
  details[open] > summary::after { content: "–"; }
  details .body { padding-bottom: 14px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ub, var(--noise-bg)); color: var(--u, var(--muted)); }

  .md { overflow-wrap: anywhere; font-size: 15px; }
  .md h1 { font-size: 18px; margin: 4px 0 8px; } .md h2 { font-size: 16px; margin: 16px 0 6px; } .md h3 { font-size: 15px; margin: 12px 0 4px; }
  .md p, .md ul, .md blockquote, .md pre { margin: 0 0 10px; }
  .md ul { padding-left: 20px; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md code { font: 13px ui-monospace, Menlo, monospace; background: var(--noise-bg); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--noise-bg); padding: 10px; border-radius: 8px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
  .md .scroll { overflow-x: auto; margin-bottom: 10px; }
  .md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
  .md th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">Library</h1>
    <button class="icon" id="gear" type="button" aria-label="Settings">⚙</button>
  </div>

  <section id="settings" class="list" hidden>
    <p class="muted">Paste a GitHub token for <code id="repoName"></code> (Issues: read and write, Contents: read-only). It stays on this phone.</p>
    <form id="tokenForm" class="row" autocomplete="off">
      <div class="grow"><input id="token" type="password" placeholder="github_pat_…" aria-label="GitHub token"></div>
      <button class="main" type="submit">Save</button>
    </form>
    <button class="chip" id="clearToken" type="button" hidden>Remove token</button>
  </section>

  <div id="view"></div>
</main>

<nav><div class="inner">
  <a href="#/library" data-tab="library">Library</a>
  <a href="#/queue" data-tab="queue">Queue<span class="n" id="qn" hidden></span></a>
  <a href="#/claims" data-tab="claims">Claims</a>
</div></nav>

<script>
(function () {
  "use strict";
  var OWNER = "ARVR7", REPO = "insta-yt-scraper", LABEL = "link";
  var ORDER = ["helpful", "mixed", "misleading", "noise"];
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view");
  var state = { library: null, filter: { q: "", usefulness: "", topic: "" }, flash: null, timer: null };

  /* ---------- storage and API ---------- */
  function getToken() { try { return localStorage.getItem("gh_token") || ""; } catch (e) { return ""; } }
  function setToken(v) { try { v ? localStorage.setItem("gh_token", v) : localStorage.removeItem("gh_token"); } catch (e) {} }
  function cacheGet(k) { try { return JSON.parse(localStorage.getItem("c:" + k)); } catch (e) { return null; } }
  function cacheSet(k, v) { try { localStorage.setItem("c:" + k, JSON.stringify(v)); } catch (e) {} }

  function api(path, opts, raw) {
    opts = opts || {};
    opts.headers = Object.assign({ "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      "Authorization": "Bearer " + getToken(), "X-GitHub-Api-Version": "2022-11-28" }, opts.headers || {});
    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + path, opts).then(function (r) {
      if (r.ok) return raw ? r.text() : r.json();
      return r.json().catch(function () { return {}; }).then(function (j) { var e = new Error(j.message || ("HTTP " + r.status)); e.status = r.status; throw e; });
    });
  }
  function file(path) {
    return api("/contents/" + path + "?ref=main", null, true).then(function (t) { cacheSet(path, t); return t; })
      .catch(function (e) { var c = cacheGet(path); if (c != null) return c; throw e; });
  }
  function loadLibrary() { return file("data/library.json").then(function (t) { state.library = JSON.parse(t); return state.library; }); }
  function loadIssues() {
    return api("/issues?labels=" + LABEL + "&state=all&per_page=50").then(function (l) {
      var items = l.filter(function (i) { return !i.pull_request; });
      var open = items.filter(function (i) { return i.state === "open"; }).length;
      $("qn").hidden = !open; $("qn").textContent = open;
      return items;
    });
  }

  /* ---------- helpers ---------- */
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function clear(n) { n.textContent = ""; }
  function plat(p) { return p === "instagram" ? "Instagram" : p === "youtube" ? "YouTube" : p; }
  function label(u) { var s = el("span", "u-" + u); s.appendChild(el("i", "dot")); s.appendChild(document.createTextNode(u)); return s; }
  function msg(text, err) { return el("p", "msg" + (err ? " err" : ""), text); }
  function needsToken() {
    var d = el("div", "empty"); d.appendChild(el("p", "", "Add your token to get started."));
    var b = el("button", "main", "Settings"); b.type = "button"; b.style.marginTop = "14px";
    b.addEventListener("click", function () { $("settings").hidden = false; $("token").focus(); });
    d.appendChild(b); return d;
  }
  function failure(e, what) {
    var d = el("div", "empty");
    d.appendChild(el("p", "", "Couldn't load " + what + "."));
    d.appendChild(el("p", "muted", e && (e.status === 401 || e.status === 403 || e.status === 404) ? "Check the token in Settings." : (e ? e.message : "")));
    return d;
  }

  /* ---------- link parsing ---------- */
  function parse(raw) {
    var u; try { u = new URL(raw); } catch (e) { return null; }
    var host = u.hostname.replace(/^www\.|^m\./, ""), m;
    if (host === "instagram.com") {
      m = u.pathname.match(/^\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/);
      if (m) return { platform: "instagram", key: m[2], url: "https://www.instagram.com/" + (m[1] === "p" ? "p" : "reel") + "/" + m[2] + "/" };
    }
    if (host === "youtu.be") { m = u.pathname.match(/^\/([\w-]{6,})/); if (m) return { platform: "youtube", key: m[1], url: "https://www.youtube.com/watch?v=" + m[1] }; }
    if (host === "youtube.com" || host === "music.youtube.com") {
      var id = u.searchParams.get("v"); m = u.pathname.match(/^\/(shorts|embed|live)\/([\w-]{6,})/);
      if (m) id = m[2];
      if (id && /^[\w-]{6,}$/.test(id)) return { platform: "youtube", key: id, url: m && m[1] === "shorts" ? "https://www.youtube.com/shorts/" + id : "https://www.youtube.com/watch?v=" + id };
    }
    return null;
  }
  function findLink(text) {
    var urls = (text || "").match(/https?:\/\/[^\s<>"']+/g) || [];
    for (var i = 0; i < urls.length; i++) { var p = parse(urls[i]); if (p) return p; }
    return null;
  }
  function queueLink(p) {
    var title = "Link: " + p.platform + " " + p.key;
    return api("/issues?labels=" + LABEL + "&state=all&per_page=100").then(function (issues) {
      var dup = issues.filter(function (i) { return i.title === title && !i.pull_request; })[0];
      if (dup) return { msg: "Already in the queue.", ok: true };
      return api("/issues", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: title, body: p.url, labels: [LABEL] }) })
        .then(function () { return { msg: "Added to the queue.", ok: true }; });
    }).catch(function (e) {
      return { msg: e.status === 401 || e.status === 403 || e.status === 404 ? "GitHub refused the token." : "Couldn't add it: " + e.message, ok: false };
    });
  }

  /* ---------- safe markdown renderer: builds DOM nodes, never innerHTML ---------- */
  function safeHref(h) {
    var m = h.match(/^(?:\.\.?\/)*notes\/(instagram|youtube)\/([\w-]+)\.md$/);
    if (m) return "#/note/" + m[1] + "/" + m[2];
    return /^https?:\/\//i.test(h) ? h : null;
  }
  function inline(parent, s) {
    var re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)\s]+\)|\*[^*\s][^*]*\*|_[^_\s][^_]*_)/g, last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      var t = m[0];
      if (t.charAt(0) === "`") parent.appendChild(el("code", "", t.slice(1, -1)));
      else if (t.indexOf("**") === 0) { var b = el("strong"); inline(b, t.slice(2, -2)); parent.appendChild(b); }
      else if (t.charAt(0) === "[") {
        var lm = t.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/), href = safeHref(lm[2]);
        if (href) { var a = el("a"); a.href = href; if (href.charAt(0) !== "#") { a.target = "_blank"; a.rel = "noopener noreferrer"; } inline(a, lm[1]); parent.appendChild(a); }
        else parent.appendChild(document.createTextNode(lm[1]));
      } else { var em = el("em"); inline(em, t.slice(1, -1)); parent.appendChild(em); }
      last = m.index + t.length;
    }
    if (last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function renderMd(src) {
    var root = el("div", "md");
    var lines = src.replace(/^---\n[\s\S]*?\n---\n/, "").split("\n"), i = 0;
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^\s*$/.test(l)) { i++; continue; }
      if (/^```/.test(l)) { var code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; var pre = el("pre"); pre.appendChild(el("code", "", code.join("\n"))); root.appendChild(pre); continue; }
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { var h = el("h" + m[1].length); inline(h, m[2]); root.appendChild(h); i++; continue; }
      if (/^>\s?/.test(l)) { var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, "")); var bq = el("blockquote"); inline(bq, q.join(" ")); root.appendChild(bq); continue; }
      if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var rows = []; while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        var cells = function (r) { return r.replace(/^\||\|\s*$/g, "").split("|").map(function (c) { return c.trim(); }); };
        var t = el("table"), thead = el("thead"), tr = el("tr");
        cells(rows[0]).forEach(function (c) { var th = el("th"); inline(th, c); tr.appendChild(th); }); thead.appendChild(tr); t.appendChild(thead);
        var tb = el("tbody"); rows.slice(2).forEach(function (r) { var trr = el("tr"); cells(r).forEach(function (c) { var td = el("td"); inline(td, c); trr.appendChild(td); }); tb.appendChild(trr); });
        t.appendChild(tb); var sc = el("div", "scroll"); sc.appendChild(t); root.appendChild(sc); continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        var ul = el("ul");
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var li = el("li"), text = lines[i++].replace(/^\s*[-*]\s+/, "");
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i])) text += " " + lines[i++].trim();
          inline(li, text); ul.appendChild(li);
          var sub = null;
          while (i < lines.length && /^\s{2,}[-*]\s+/.test(lines[i])) { sub = sub || el("ul"); var sli = el("li"); inline(sli, lines[i++].replace(/^\s+[-*]\s+/, "")); sub.appendChild(sli); }
          if (sub) li.appendChild(sub);
        }
        root.appendChild(ul); continue;
      }
      var para = [l]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|>|```|\|.*\||\s*[-*]\s+)/.test(lines[i])) para.push(lines[i++]);
      var p = el("p"); inline(p, para.join(" ")); root.appendChild(p);
    }
    return root;
  }
  function section(title, md, open) {
    var d = el("details"); if (open) d.open = true;
    d.appendChild(el("summary", "", title));
    var b = el("div", "body"); b.appendChild(renderMd(md)); d.appendChild(b); return d;
  }

  /* ---------- Library ---------- */
  function openNote(it) { location.hash = "#/note/" + it.platform + "/" + it.id; }
  function itemCard(it) {
    var c = el("article", "card u-" + it.usefulness); c.tabIndex = 0;
    c.appendChild(el("h3", "", it.title));
    var sub = el("div", "sub"); sub.appendChild(label(it.usefulness)); sub.appendChild(document.createTextNode(" · " + plat(it.platform)));
    c.appendChild(sub); c.appendChild(el("p", "key", it.key_info));
    c.addEventListener("click", function () { openNote(it); });
    c.addEventListener("keydown", function (e) { if (e.key === "Enter") openNote(it); });
    return c;
  }
  function viewLibrary() {
    $("title").textContent = "Library"; clear(view);
    if (!getToken()) { view.appendChild(needsToken()); return; }
    var box = el("div", "list"); view.appendChild(box);
    loadLibrary().then(function (lib) {
      loadIssues().catch(function () {});
      var f = state.filter;
      var q = el("input"); q.type = "search"; q.placeholder = "Search"; q.value = f.q; q.setAttribute("aria-label", "Search");
      var chips = el("div", "chips"), results = el("div", "list");
      box.appendChild(q); box.appendChild(chips); box.appendChild(results);
      var counts = {}; lib.forEach(function (i) { counts[i.usefulness] = (counts[i.usefulness] || 0) + 1; });
      var defs = [["", "All " + lib.length]].concat(ORDER.filter(function (u) { return counts[u]; }).map(function (u) { return [u, u + " " + counts[u]]; }));
      var btns = defs.map(function (d) {
        var b = el("button", "chip", d[1]); b.type = "button";
        b.addEventListener("click", function () { f.usefulness = d[0]; draw(); }); chips.appendChild(b); return b;
      });
      var topicChip = el("button", "chip"); topicChip.type = "button";
      topicChip.addEventListener("click", function () { f.topic = ""; draw(); });
      function draw() {
        btns.forEach(function (b, k) { b.setAttribute("aria-pressed", f.usefulness === defs[k][0] ? "true" : "false"); });
        topicChip.hidden = !f.topic; topicChip.textContent = f.topic + " ✕"; if (f.topic && !topicChip.parentNode) chips.appendChild(topicChip);
        var needle = f.q.trim().toLowerCase();
        var hit = lib.filter(function (i) {
          if (f.usefulness && i.usefulness !== f.usefulness) return false;
          if (f.topic && i.topics.indexOf(f.topic) < 0) return false;
          return !needle || [i.title, i.author, i.key_info, i.topics.join(" "), i.tools.join(" ")].join(" ").toLowerCase().indexOf(needle) >= 0;
        });
        clear(results);
        if (!hit.length) results.appendChild(el("p", "empty", lib.length ? "Nothing matches." : "No links yet. Share one to this app."));
        hit.forEach(function (it) { results.appendChild(itemCard(it)); });
      }
      q.addEventListener("input", function () { f.q = q.value; draw(); });
      draw();
    }).catch(function (e) { box.appendChild(failure(e, "the library")); });
  }

  /* ---------- Note ---------- */
  function viewNote(platform, id) {
    $("title").textContent = ""; clear(view);
    var back = el("button", "icon back", "← Back"); back.type = "button"; back.style.fontSize = "15px";
    back.addEventListener("click", function () { history.length > 1 ? history.back() : (location.hash = "#/library"); });
    view.appendChild(back);
    if (!getToken()) { view.appendChild(needsToken()); return; }
    var box = el("div", "list"); view.appendChild(box);
    Promise.all([file("notes/" + platform + "/" + id + ".md"), (state.library ? Promise.resolve(state.library) : loadLibrary()).catch(function () { return []; })]).then(function (r) {
      var t = r[0], it = r[1].filter(function (x) { return x.platform === platform && x.id === id; })[0] || {};
      var body = t.replace(/^---\n[\s\S]*?\n---\n/, "");
      var head = el("div", "list u-" + (it.usefulness || "noise"));
      var h = el("h1", "", it.title || id); h.style.fontSize = "24px"; head.appendChild(h);
      var sub = el("div", "sub muted"); if (it.usefulness) { sub.appendChild(label(it.usefulness)); sub.appendChild(document.createTextNode(" · ")); } sub.appendChild(document.createTextNode(plat(platform))); head.appendChild(sub);
      if (it.key_info) head.appendChild(el("p", "lead", it.key_info));
      var url = (t.match(/^url:\s*(\S+)/m) || [])[1];
      if (url && /^https?:\/\//.test(url)) { var a = el("a", "btn-link", "Open original ↗"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.alignSelf = "flex-start"; head.appendChild(a); }
      if (it.topics && it.topics.length) {
        var tr = el("div", "chips");
        it.topics.forEach(function (tp) { var b = el("button", "chip", tp); b.type = "button"; b.addEventListener("click", function () { state.filter = { q: "", usefulness: "", topic: tp }; location.hash = "#/library"; }); tr.appendChild(b); });
        head.appendChild(tr);
      }
      box.appendChild(head);
      var parts = body.split(/^## /m).slice(1), by = {};
      parts.forEach(function (p) { var nl = p.indexOf("\n"); by[p.slice(0, nl).trim()] = p.slice(nl + 1); });
      var rk = Object.keys(by).filter(function (k) { return /^Research/.test(k); })[0];
      if (by["Summary"]) box.appendChild(section("Summary", by["Summary"], true));
      if (rk) box.appendChild(section("What checks out", by[rk], true));
      box.appendChild(section("Full note", body, false));
    }).catch(function (e) { box.appendChild(failure(e, "this note")); });
  }

  /* ---------- Queue ---------- */
  function trackFor(issue) {
    var names = issue.labels.map(function (l) { return l.name; });
    var warn = names.indexOf("needs-input") >= 0 && issue.state !== "closed";
    var step = issue.state === "closed" ? 3 : (names.indexOf("processing") >= 0 || warn) ? 2 : 1;
    var tr = el("div", "track" + (warn ? " warn" : ""));
    for (var k = 1; k <= 3; k++) tr.appendChild(el("span", k <= step ? "on" : ""));
    return { node: tr, word: warn ? "Needs your input" : ["", "Waiting", "Working", "Done"][step] };
  }
  function viewQueue() {
    $("title").textContent = "Queue"; clearInterval(state.timer); clear(view);
    var box = el("div", "list"); view.appendChild(box);
    var flash = state.flash; state.flash = null;
    var form = el("form", "row"); form.autocomplete = "off";
    var w = el("div", "grow"), inp = el("input"); inp.type = "url"; inp.placeholder = "Paste a link"; inp.setAttribute("aria-label", "Link to add"); w.appendChild(inp);
    var btn = el("button", "main", "Add"); btn.type = "submit";
    form.appendChild(w); form.appendChild(btn); box.appendChild(form);
    var note = msg(flash ? flash.msg : "", flash && !flash.ok); box.appendChild(note);
    var list = el("div", "list"); box.appendChild(list);
    if (!getToken()) { clear(view); view.appendChild(needsToken()); return; }
    form.addEventListener("submit", function (e) {
      e.preventDefault(); var p = findLink(inp.value);
      if (!p) { note.className = "msg err"; note.textContent = "Not an Instagram or YouTube link."; return; }
      btn.disabled = true; queueLink(p).then(function (r) { state.flash = r; viewQueue(); });
    });
    state.timer = setInterval(function () {
      if (document.visibilityState === "visible" && !inp.value && document.activeElement !== inp) viewQueue();
    }, 60000);
    loadIssues().then(function (issues) {
      return Promise.resolve(state.library || loadLibrary().catch(function () { return []; })).then(function (lib) {
        if (!issues.length) { list.appendChild(el("p", "empty", "Queue is empty.")); return; }
        issues.forEach(function (iss) {
          var m = iss.title.match(/^Link: (\w+) ([\w-]+)$/);
          var done = m && (lib || []).filter(function (x) { return x.platform === m[1] && x.id === m[2]; })[0];
          var tk = trackFor(iss);
          var c = el("article", "card" + (done ? " u-" + done.usefulness : "")); c.tabIndex = 0;
          c.appendChild(el("h3", "", done ? done.title : (m ? plat(m[1]) + " · " + m[2] : iss.title)));
          var sub = el("div", "sub"); if (done) { sub.appendChild(label(done.usefulness)); sub.appendChild(document.createTextNode(" · ")); } sub.appendChild(document.createTextNode(tk.word));
          c.appendChild(sub); c.appendChild(tk.node);
          var go = function () { if (done) openNote(done); else window.open(iss.html_url, "_blank", "noopener"); };
          c.addEventListener("click", go); c.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
          list.appendChild(c);
        });
      });
    }).catch(function (e) { list.appendChild(failure(e, "the queue")); });
  }

  /* ---------- Claims ---------- */
  var CLAIMS = [["verified", "Verified", "registry/verified.md"], ["hoax", "Hoax", "registry/hoax.md"], ["sidequests", "Side quests", "registry/sidequests.md"]];
  function verdictClass(v) { return /^verified-with/.test(v) ? "u-mixed" : /^verified/.test(v) ? "u-helpful" : /misleading|hoax/.test(v) ? "u-misleading" : "u-noise"; }
  function viewClaims(which) {
    $("title").textContent = "Claims"; clear(view);
    var seg = el("div", "chips");
    CLAIMS.forEach(function (c) { var b = el("button", "chip", c[1]); b.type = "button"; b.setAttribute("aria-pressed", c[0] === which ? "true" : "false"); b.addEventListener("click", function () { location.hash = "#/claims/" + c[0]; }); seg.appendChild(b); });
    view.appendChild(seg);
    if (!getToken()) { view.appendChild(needsToken()); return; }
    var box = el("div", "list"); view.appendChild(box);
    var path = (CLAIMS.filter(function (c) { return c[0] === which; })[0] || CLAIMS[0])[2];
    file(path).then(function (t) {
      var items = [], cur = null, group = "";
      t.split("\n").forEach(function (l) {
        var m;
        if ((m = l.match(/^## (.*)/))) { group = m[1]; cur = null; }
        else if ((m = l.match(/^### (.*)/))) { cur = { name: m[1].replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/, "").trim(), group: group, lines: [] }; items.push(cur); }
        else if (cur) cur.lines.push(l);
      });
      if (!items.length) { box.appendChild(el("p", "empty", "Nothing here yet.")); return; }
      items.forEach(function (it) {
        var body = it.lines.join("\n");
        var v = (body.match(/\*\*Verdict:\*\*\s*([\w-]+)/) || [])[1] || "", what = (body.match(/\*\*What it is:\*\*\s*(.*)/) || [])[1] || "";
        var d = el("details", verdictClass(v));
        var s = el("summary"); s.appendChild(el("span", "", it.name));
        d.appendChild(s);
        var b = el("div", "body");
        var tag = el("span", "tag", v.replace(/-/g, " ") + (/Pending/.test(it.group) ? " · pending" : "")); b.appendChild(tag);
        if (what) { var wp = el("p", "lead"); wp.style.fontSize = "16px"; wp.style.margin = "10px 0"; inline(wp, what); b.appendChild(wp); }
        var rest = el("details"); rest.style.padding = "0"; rest.style.background = "none";
        rest.appendChild(el("summary", "", "Details")); var rb = el("div", "body"); rb.appendChild(renderMd(body)); rest.appendChild(rb); b.appendChild(rest);
        d.appendChild(b); box.appendChild(d);
      });
    }).catch(function (e) { box.appendChild(failure(e, "the claims")); });
  }

  /* ---------- router ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var tab = parts[0] || "library";
    Array.prototype.forEach.call(document.querySelectorAll("nav a"), function (a) { a.setAttribute("aria-current", a.dataset.tab === (tab === "note" ? "library" : tab) ? "page" : "false"); });
    window.scrollTo(0, 0); clearInterval(state.timer);
    if (tab === "queue") viewQueue();
    else if (tab === "claims") viewClaims(parts[1] || "verified");
    else if (tab === "note" && parts[1] && parts[2]) viewNote(parts[1].replace(/[^\w]/g, ""), parts[2].replace(/[^\w-]/g, ""));
    else viewLibrary();
  }

  /* ---------- settings ---------- */
  $("repoName").textContent = OWNER + "/" + REPO;
  function refreshSettings() { var has = !!getToken(); $("clearToken").hidden = !has; $("token").placeholder = has ? "Saved. Paste to replace." : "github_pat_…"; }
  $("gear").addEventListener("click", function () { $("settings").hidden = !$("settings").hidden; });
  $("tokenForm").addEventListener("submit", function (e) { e.preventDefault(); var v = $("token").value.trim(); if (!v) return; setToken(v); $("token").value = ""; $("settings").hidden = true; refreshSettings(); state.library = null; route(); });
  $("clearToken").addEventListener("click", function () { setToken(""); refreshSettings(); state.library = null; route(); });
  refreshSettings();
  if (!getToken()) $("settings").hidden = false;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  window.addEventListener("hashchange", route);

  /* ---------- share target: ?title=&text=&url= ---------- */
  var qs = new URLSearchParams(location.search);
  var shared = [qs.get("url"), qs.get("text"), qs.get("title")].filter(Boolean).join(" ");
  if (shared) {
    var p = findLink(shared);
    history.replaceState(null, "", location.pathname + "#/queue");
    if (!p) { state.flash = { msg: "No Instagram or YouTube link found.", ok: false }; route(); }
    else if (!getToken()) { state.flash = { msg: "Add your token in Settings, then share again.", ok: false }; route(); }
    else { $("title").textContent = "Queue"; view.textContent = "Adding…"; queueLink(p).then(function (r) { state.flash = r; route(); }); }
  } else route();
})();
</script>
</body>
