name: probe-fetch
# Manual test: can GitHub's runners fetch what the cloud sandbox cannot?
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube URL to test
        default: https://www.youtube.com/shorts/R4yihx8sEO8
      instagram_url:
        description: Instagram URL to test
        default: https://www.instagram.com/p/Dd1_GC-sJVz/
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp youtube-transcript-api instaloader
      - name: YouTube media
        continue-on-error: true
        run: |
          yt-dlp --no-playlist --js-runtimes node -f worstaudio -o "a.%(ext)s" "${{ inputs.youtube_url }}" 2>&1 | tail -4
          ls -la a.* || true
      - name: YouTube transcript API
        continue-on-error: true
        run: |
          python - <<'PY'
          import re
          from youtube_transcript_api import YouTubeTranscriptApi
          vid = re.search(r"([\w-]{11})", "${{ inputs.youtube_url }}".split("shorts/")[-1]).group(1)
          try:
              t = YouTubeTranscriptApi().fetch(vid)
              print("TRANSCRIPT OK", len(t.snippets), "segments:", " ".join(s.text for s in t.snippets)[:300])
          except Exception as e:
              print("TRANSCRIPT FAIL", type(e).__name__, str(e)[:200])
          PY
      - name: Instagram
        continue-on-error: true
        run: |
          yt-dlp --no-playlist -f worst -o "i.%(ext)s" "${{ inputs.instagram_url }}" 2>&1 | tail -3
          ls -la i.* || true
